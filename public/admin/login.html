<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Chatbot</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            background-color: #f5f5f5;
        }
        .login-container {
            max-width: 400px;
            padding: 15px;
            margin: auto;
        }
        .form-signin {
            width: 100%;
            max-width: 330px;
            padding: 15px;
            margin: auto;
        }
        .form-signin .form-floating:focus-within {
            z-index: 2;
        }
        .form-message {
            display: none;
            margin-bottom: 15px;
        }
        .form-links {
            margin-top: 12px;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="login-container">
            <div class="text-center mb-4">
                <h1 class="h3 mb-3 fw-normal">Chatbot Admin</h1>
                <p id="page-subtitle">Please sign in to access the admin dashboard</p>
            </div>

            <!-- Sign in -->
            <section id="login-panel" hidden>
                <div id="login-error" class="form-message text-center" role="alert" aria-live="assertive"></div>

                <form id="login-form" class="form-signin" novalidate>
                    <div class="form-floating mb-3">
                        <input type="text" class="form-control" id="username" name="username"
                               placeholder="Username" autocomplete="username" autocapitalize="none"
                               spellcheck="false" required>
                        <label for="username">Username</label>
                    </div>
                    <div class="form-floating mb-3">
                        <input type="password" class="form-control" id="password" name="password"
                               placeholder="Password" autocomplete="current-password" required>
                        <label for="password">Password</label>
                    </div>
                    <button class="w-100 btn btn-lg btn-primary" type="submit">Sign in</button>
                    <div class="form-links text-center">
                        <a href="#" id="forgot-link">Forgot password?</a>
                    </div>
                </form>
            </section>

            <!-- Request a reset link -->
            <section id="forgot-panel" hidden>
                <div id="forgot-message" class="form-message text-center" role="status" aria-live="polite"></div>

                <form id="forgot-form" class="form-signin" novalidate>
                    <p class="text-muted small">
                        Enter the email address on your account and we will send a link to choose a new password.
                    </p>
                    <div class="form-floating mb-3">
                        <input type="email" class="form-control" id="forgot-email" name="email"
                               placeholder="Email" autocomplete="email" required>
                        <label for="forgot-email">Email address</label>
                    </div>
                    <button class="w-100 btn btn-lg btn-primary" type="submit">Send reset link</button>
                    <div class="form-links text-center">
                        <a href="#" id="forgot-back">Back to sign in</a>
                    </div>
                </form>
            </section>

            <!-- Choose a new password (from the emailed link) -->
            <section id="reset-panel" hidden>
                <div id="reset-message" class="form-message text-center" role="alert" aria-live="assertive"></div>

                <form id="reset-form" class="form-signin" novalidate>
                    <p class="text-muted small">Choose a new password for your account.</p>
                    <div class="form-floating mb-3">
                        <input type="password" class="form-control" id="reset-password" name="new-password"
                               placeholder="New password" autocomplete="new-password" minlength="8" required>
                        <label for="reset-password">New password</label>
                    </div>
                    <div class="form-floating mb-3">
                        <input type="password" class="form-control" id="reset-password-confirm" name="confirm-password"
                               placeholder="Confirm new password" autocomplete="new-password" minlength="8" required>
                        <label for="reset-password-confirm">Confirm new password</label>
                    </div>
                    <button class="w-100 btn btn-lg btn-primary" type="submit">Change password</button>
                    <div class="form-links text-center">
                        <a href="#" id="reset-back">Back to sign in</a>
                    </div>
                </form>
            </section>
        </div>
    </div>

    <script src="/js/admin-login.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Shown by the operator app's service worker (sw.js) when a dashboard
         page cannot be reached. No script: it tries again by reloading,
         and the reload is the dashboard as soon as the connection is back. -->
    <meta http-equiv="refresh" content="20">
    <meta name="theme-color" content="#2563eb">
    <title>Offline</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f6f7f9;
            color: #111827;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        }
        main {
            max-width: 26rem;
            margin: 1.5rem;
            padding: 2rem 1.5rem;
            background: #fff;
            border: 1px solid #e5e7eb;
            border-radius: 0.75rem;
            text-align: center;
        }
        img {
            width: 64px;
            height: 64px;
        }
        h1 {
            font-size: 1.25rem;
            margin: 1rem 0 0.5rem;
        }
        p {
            color: #6b7280;
            line-height: 1.5;
            margin: 0 0 1.25rem;
        }
        a {
            display: inline-block;
            padding: 0.5rem 1.25rem;
            border-radius: 0.375rem;
            background: #2563eb;
            color: #fff;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <main>
        <img src="/admin/icons/icon-192.png" alt="">
        <h1>You're offline</h1>
        <p>Conversations will appear when you reconnect. This page tries again by itself every 20 seconds.</p>
        <a href="">Try again now</a>
    </main>
</body>
</html>

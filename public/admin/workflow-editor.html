<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workflow Editor · Chatbot Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/workflow-editor.css">
</head>
<body>
    <div class="wf-app">
        <!-- Toolbar -->
        <header class="wf-toolbar">
            <div class="wf-toolbar-left">
                <button class="btn btn-sm btn-outline-secondary" id="wf-back" title="Back to dashboard">
                    <i data-feather="arrow-left"></i>
                </button>

                <div class="dropdown">
                    <button class="btn btn-sm btn-light dropdown-toggle wf-title-button" data-bs-toggle="dropdown">
                        <span id="wf-title">Untitled workflow</span>
                    </button>
                    <ul class="dropdown-menu wf-workflow-list" id="wf-workflow-list"></ul>
                </div>

                <button class="btn btn-sm btn-link text-secondary p-1" id="wf-rename" title="Rename">
                    <i data-feather="edit-2"></i>
                </button>

                <span class="wf-status wf-status-draft" id="wf-status">draft</span>
                <span class="text-muted small" id="wf-version">v1</span>
            </div>

            <div class="wf-toolbar-right">
                <span class="wf-save-state text-muted" id="wf-save-state">Not saved yet</span>

                <div class="btn-group btn-group-sm" role="group" aria-label="History">
                    <button class="btn btn-outline-secondary" id="wf-undo" title="Undo (Ctrl+Z)">
                        <i data-feather="corner-up-left"></i>
                    </button>
                    <button class="btn btn-outline-secondary" id="wf-redo" title="Redo (Ctrl+Shift+Z)">
                        <i data-feather="corner-up-right"></i>
                    </button>
                </div>

                <button class="btn btn-sm btn-outline-secondary" id="wf-validate" title="Check for problems">
                    <i data-feather="check-circle"></i> Validate
                </button>

                <button class="btn btn-sm btn-outline-primary" id="wf-save" title="Save (Ctrl+S)">
                    <i data-feather="save"></i> Save
                </button>

                <button class="btn btn-sm btn-primary" id="wf-publish" title="Make this workflow live">
                    <i data-feather="upload-cloud"></i> Publish
                </button>

                <div class="dropdown">
                    <button class="btn btn-sm btn-outline-secondary" data-bs-toggle="dropdown" aria-label="More actions">
                        <i data-feather="more-vertical"></i>
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end">
                        <li><button class="dropdown-item" id="wf-versions"><i data-feather="clock"></i> Version history</button></li>
                        <li><button class="dropdown-item" id="wf-duplicate"><i data-feather="copy"></i> Duplicate</button></li>
                        <li><hr class="dropdown-divider"></li>
                        <li><button class="dropdown-item text-danger" id="wf-delete"><i data-feather="trash-2"></i> Delete workflow</button></li>
                    </ul>
                </div>
            </div>
        </header>

        <div class="wf-body">
            <!-- Palette -->
            <aside class="wf-sidebar">
                <div class="wf-sidebar-header">
                    <h6 class="mb-0">Building blocks</h6>
                    <p class="small text-muted mb-0">Drag onto the canvas, or click to add.</p>
                </div>
                <div id="wf-palette" class="wf-palette"></div>
            </aside>

            <!-- Canvas -->
            <main class="wf-canvas" id="wf-canvas">
                <div class="wf-surface" id="wf-surface">
                    <svg class="wf-edge-layer" id="wf-edges" xmlns="http://www.w3.org/2000/svg"></svg>
                    <div class="wf-node-layer" id="wf-nodes"></div>
                </div>

                <div class="wf-empty-hint" id="wf-empty-hint">
                    <i data-feather="git-branch"></i>
                    <p>Start by adding a <strong>Persona</strong> and a <strong>Start</strong> node.</p>
                </div>

                <div class="wf-canvas-controls">
                    <button class="btn btn-sm btn-light" id="wf-zoom-out" title="Zoom out"><i data-feather="minus"></i></button>
                    <span class="wf-zoom-label" id="wf-zoom-label">100%</span>
                    <button class="btn btn-sm btn-light" id="wf-zoom-in" title="Zoom in"><i data-feather="plus"></i></button>
                    <button class="btn btn-sm btn-light" id="wf-fit" title="Fit to view"><i data-feather="maximize"></i></button>
                </div>

                <div class="wf-problems-panel">
                    <button class="wf-problems-toggle" data-bs-toggle="collapse" data-bs-target="#wf-problems-body">
                        <i data-feather="alert-circle"></i>
                        Problems
                        <span class="badge bg-secondary" id="wf-problem-count">0</span>
                    </button>
                    <div class="collapse" id="wf-problems-body">
                        <div id="wf-problems">
                            <div class="text-muted small px-3 py-2">Run <strong>Validate</strong> to check this workflow.</div>
                        </div>
                    </div>
                </div>

                <div class="wf-loading" id="wf-loading" style="display: none;">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">Loading…</span>
                    </div>
                </div>
            </main>

            <!-- Properties -->
            <aside class="wf-properties" id="wf-properties-panel">
                <div class="wf-sidebar-header">
                    <h6 class="mb-0">Properties</h6>
                </div>
                <div id="wf-properties" class="wf-properties-body"></div>
            </aside>
        </div>
    </div>

    <!-- Version history -->
    <div class="modal fade" id="wf-versions-modal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Version history</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body" id="wf-version-list"></div>
            </div>
        </div>
    </div>

    <div class="toast-container position-fixed bottom-0 end-0 p-3"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/feather-icons@4.28.0/dist/feather.min.js"></script>
    <script src="/js/workflow-editor/editor.js"></script>
</body>
</html>
